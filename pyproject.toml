[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matprice"
version = "1.0.0"
description = "Forecasting UK construction-material price indices with rolling-origin backtests and cost-escalation ranges"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mohamed Ragab" }]
keywords = ["time series", "forecasting", "construction", "cost escalation", "ONS", "price index", "backtesting"]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "statsmodels>=0.14"]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.5", "matplotlib>=3.8"]

[project.scripts]
matprice = "matprice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E702"]
